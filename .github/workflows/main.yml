name: SkillSathi CI/CD Pipeline

# ──────────────────────────────────────────────────────────────────
# TRIGGERS: Run on push to main, or on pull requests targeting main
# ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════
# STAGE 1: DETECT CHANGES — Only build what actually changed
# ══════════════════════════════════════════════════════════════════
jobs:
  detect-changes:
    name: "🔍 Stage 1 — Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ml-service: ${{ steps.filter.outputs.ml-service }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            ml-service:
              - 'ml-service/**'

  # ══════════════════════════════════════════════════════════════════
  # STAGE 2: FRONTEND — Install, Lint, and Build React + Vite App
  # ══════════════════════════════════════════════════════════════════
  frontend-build:
    name: "⚛️ Stage 2 — Frontend Build & Lint"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'push'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (OxLint)
        run: npm run lint
        continue-on-error: true

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ══════════════════════════════════════════════════════════════════
  # STAGE 3: BACKEND — Restore, Build, and Validate .NET 9 API
  # ══════════════════════════════════════════════════════════════════
  backend-build:
    name: "🔧 Stage 3 — Backend Build & Validate"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'push'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore NuGet Dependencies
        run: dotnet restore

      - name: Build Release Configuration
        run: dotnet build -c Release --no-restore

      - name: Publish Release Artifact
        run: dotnet publish -c Release -o ./publish --no-build

      - name: Verify Docker Build
        run: docker build -t skillsathi-backend:test .

  # ══════════════════════════════════════════════════════════════════
  # STAGE 4: ML SERVICE — Validate Python & FastAPI Dependencies
  # ══════════════════════════════════════════════════════════════════
  ml-service-build:
    name: "🤖 Stage 4 — ML Service Validate"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ml-service == 'true' || github.event_name == 'push'
    defaults:
      run:
        working-directory: ml-service
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-service/requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Validate FastAPI App Imports
        run: python -c "from main import app; print('✅ FastAPI app loaded successfully')"

      - name: Verify Docker Build
        run: docker build -t skillsathi-ml:test .

  # ══════════════════════════════════════════════════════════════════
  # STAGE 5: DEPLOY — Trigger Vercel & Render Deploy Hooks
  # ══════════════════════════════════════════════════════════════════
  deploy:
    name: "🚀 Stage 5 — Deploy to Production"
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build, ml-service-build]
    # Only deploy on push to main (not on PRs)
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure')
    steps:
      - name: "🌐 Deploy Frontend → Vercel"
        if: needs.frontend-build.result == 'success'
        run: |
          echo "🚀 Triggering Vercel deployment..."
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{}' && echo "✅ Vercel deploy triggered!" || echo "⚠️ Vercel hook not configured — Vercel auto-deploys from GitHub"

      - name: "🔧 Deploy Backend → Render"
        if: needs.backend-build.result == 'success'
        run: |
          echo "🚀 Triggering Render Backend deployment..."
          curl -s -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" && echo "✅ Render Backend deploy triggered!" || echo "⚠️ Render hook not configured — Render auto-deploys from GitHub"

      - name: "🤖 Deploy ML Service → Render"
        if: needs.ml-service-build.result == 'success'
        run: |
          echo "🚀 Triggering Render ML Service deployment..."
          curl -s -X POST "${{ secrets.RENDER_ML_DEPLOY_HOOK }}" && echo "✅ Render ML deploy triggered!" || echo "⚠️ Render hook not configured — Render auto-deploys from GitHub"

      - name: "📊 Deployment Summary"
        run: |
          echo "╔══════════════════════════════════════════════╗"
          echo "║     🎉 SKILLSATHI DEPLOYMENT COMPLETE 🎉    ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Frontend  →  Vercel     ✅                 ║"
          echo "║  Backend   →  Render     ✅                 ║"
          echo "║  ML Engine →  Render     ✅                 ║"
          echo "╚══════════════════════════════════════════════╝"


